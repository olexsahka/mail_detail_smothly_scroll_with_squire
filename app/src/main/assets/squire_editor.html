<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.25, maximum-scale=5.0">
    <style>
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            padding: 12px 16px 20px;
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #1a1a1a;
            background: #ffffff;
            word-wrap: break-word;
            overflow-x: hidden;
        }
        #editor { min-height: 80px; outline: none; }
        #editor img { max-width: 100%; height: auto; }
        #editor table {
            max-width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }
        #editor blockquote {
            border-left: 3px solid #dadce0;
            margin: 8px 0;
            padding: 4px 12px;
            color: #5f6368;
        }
        #editor a { color: #1a73e8; }
        #editor pre {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 13px;
            white-space: pre-wrap;
        }
        #editor code {
            background: #f1f3f4;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 13px;
        }
        #editor ul, #editor ol { padding-left: 24px; }
        #editor li { margin-bottom: 4px; }
        #editor h1, #editor h2, #editor h3 { line-height: 1.3; }
        #editor hr { border: none; border-top: 1px solid #e8eaed; margin: 16px 0; }
    </style>
</head>
<body>
<div id="editor"></div>
<!-- DOMPurify is REQUIRED by Squire 2.x: setHTML() calls sanitizeToDOMFragment
     and silently drops content if no sanitizer is provided. Load it first.
     Both scripts bundled in assets/ — no network dependency, no CDN supply-
     chain risk, works offline. -->
<script src="dompurify.min.js"></script>
<script src="squire.js"></script>
<script>
    var editor = null;
    var reportScheduled = false;

    function sanitizeToDOMFragment(html) {
        if (window.DOMPurify) {
            return DOMPurify.sanitize(html, { RETURN_DOM_FRAGMENT: true });
        }
        // Fallback (should never fire — DOMPurify is bundled in assets/).
        var d = document.createElement('div');
        d.textContent = html || '';
        var frag = document.createDocumentFragment();
        while (d.firstChild) frag.appendChild(d.firstChild);
        return frag;
    }

    function scheduleReport() {
        if (reportScheduled) return;
        reportScheduled = true;
        setTimeout(function() {
            reportScheduled = false;
            reportHeight();
        }, 100);
    }

    function reportHeight() {
        var h = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight,
            document.body.offsetHeight
        );
        if (window.Bridge) Bridge.onHeightChanged(h);
    }

    function initEditor() {
        var el = document.getElementById('editor');
        editor = new Squire(el, {
            blockTag: 'p',
            sanitizeToDOMFragment: sanitizeToDOMFragment
        });

        var html = window.Bridge ? Bridge.requestHtml() : '';
        var readOnly = window.Bridge ? Bridge.requestReadOnly() : true;

        if (html) {
            editor.setHTML(html);
        }
        applyReadOnly(readOnly);

        editor.addEventListener('input', scheduleReport);

        if (window.Bridge) Bridge.onReady();

        setTimeout(reportHeight, 300);
    }

    function applyReadOnly(ro) {
        var el = document.getElementById('editor');
        el.setAttribute('contenteditable', ro ? 'false' : 'true');
    }

    /* ── Android-callable functions ── */

    function setHtmlBase64(b64) {
        try {
            var decoded = decodeURIComponent(escape(atob(b64)));
            if (editor) {
                editor.setHTML(decoded);
                setTimeout(reportHeight, 300);
            }
        } catch (e) { console.error('setHtmlBase64 error', e); }
    }

    function getHtml() { return editor ? editor.getHTML() : ''; }

    function setReadOnly(ro) { applyReadOnly(ro); }

    function execBold()          { editor && editor.bold(); }
    function execItalic()        { editor && editor.italic(); }
    function execUnderline()     { editor && editor.underline(); }
    function execOrderedList()   { editor && editor.makeOrderedList(); }
    function execUnorderedList() { editor && editor.makeUnorderedList(); }
    function execLink(url)       { editor && editor.makeLink(url); }
    function execRemoveFormat()  { editor && editor.removeAllFormatting(); }

    window.addEventListener('load', initEditor);
    window.addEventListener('resize', scheduleReport);
</script>
</body>
</html>
