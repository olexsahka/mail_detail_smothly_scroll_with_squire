<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.25, maximum-scale=5.0">
    <style>
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #1a1a1a;
            background: #ffffff;
            word-wrap: break-word;
        }

        /* ── Spacers reserve vertical space for native overlays ── */
        /* Heights are set from JS after native overlays report their measured size. */
        .app-bar-spacer     { height: 128px; }
        .msg-header-spacer  { height: 64px; }
        .msg-footer-spacer  { height: 48px; }

        /* Height transitions for intentional expand/collapse (header details
           toggle, etc). Applied by JS via .animating-height class ONLY for
           significant, user-initiated changes — never on first render, pinch
           reflow, or small measurement drift, which would flicker. */
        /* cubic-bezier(0, 0, 0.2, 1) = Material's LinearOutSlowIn — same
           curve the chevron rotation uses in Compose, so both animations
           feel synchronised. `contain: layout` scopes the per-frame
           reflow to the spacer element. `will-change: height` primes the
           compositor. */
        .msg-header-spacer.animating-height,
        .msg-footer-spacer.animating-height {
            transition: height 220ms cubic-bezier(0, 0, 0.2, 1);
            contain: layout;
            will-change: height;
        }

        /* Note: no CSS transition on `.msg-body` height. Bodies are content-
           heavy (sanitized HTML, tables, images, scale wrapper) — a per-frame
           `height` reflow drops frames of the transition itself on real
           threads. `toggleExpanded()` therefore snaps body insert/remove and
           relies on the header/footer spacer transitions above to smooth
           out just the header details expander. See conversation.js
           `toggleExpanded`. */

        /* Faint outline while debugging; remove for release */
        .debug-spacers .app-bar-spacer,
        .debug-spacers .msg-header-spacer,
        .debug-spacers .msg-footer-spacer {
            outline: 1px dashed rgba(255, 0, 0, 0.3);
        }

        /* ── Message body styling ── */
        .msg-body {
            padding: 12px 16px 20px;
            overflow-x: hidden;
        }
        /* Wrapper that fixLayout.js targets (scale/transform host).
           Zoom/transform mutations land here, keeping .msg-body geometry
           stable for the native overlay measurement pipeline. */
        .mail-scale-wrapper { display: block; }
        /* No CSS max-width / overflow clamping on wide content — fixLayout
           needs the raw overflow to detect it and pick a scale factor.
           `img` still keeps a height:auto so aspect ratio survives when
           fixLayout narrows the maxWidth. */
        .msg-body img { height: auto; }
        .msg-body table {
            border-collapse: collapse;
        }
        .msg-body blockquote {
            border-left: 3px solid #dadce0;
            margin: 8px 0;
            padding: 4px 12px;
            color: #5f6368;
        }
        .msg-body a { color: #1a73e8; }
        .msg-body pre {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 13px;
            white-space: pre-wrap;
        }
        .msg-body code {
            background: #f1f3f4;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 13px;
        }
        .msg-body ul, .msg-body ol { padding-left: 24px; }
        .msg-body li { margin-bottom: 4px; }
        .msg-body h1, .msg-body h2, .msg-body h3 { line-height: 1.3; }
        .msg-body hr { border: none; border-top: 1px solid #e8eaed; margin: 16px 0; }

        /* ── Message-body loader spacer ──
           Reserves DOM space for the native shimmer overlay while the
           message body is "loading". Height is pushed by native via
           setSpacerHeight; the default (200px) is just a first-paint
           reasonable size before the real overlay height arrives. */
        .msg-body-spacer { height: 200px; }

        /* ── Remote-image placeholder ── */
        img[data-blocked] {
            display: inline-block;
            padding: 12px 16px;
            min-width: 140px;
            min-height: 32px;
            background: #f1f3f4;
            border: 1px dashed #bdc1c6;
            border-radius: 4px;
            color: #5f6368;
            font-size: 12px;
            text-align: center;
            vertical-align: middle;
        }
        img[data-blocked]::before {
            content: "Remote image blocked";
        }
    </style>
</head>
<body>
<div id="conversation"></div>
<script src="dompurify.min.js"></script>
<script src="fixLayout.js"></script>
<script src="conversation.js"></script>
</body>
</html>
